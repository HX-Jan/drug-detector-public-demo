plugins { id 'application' }
dependencies { implementation project(':core') }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
application { mainClass = 'org.example.detector.desktop.DesktopApp' }
tasks.register('verifyUi', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.detector.desktop.DesktopVerification'
    args layout.buildDirectory.dir('ui-evidence').get().asFile.absolutePath
}
