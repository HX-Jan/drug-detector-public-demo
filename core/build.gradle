plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('verify', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.detector.core.CoreVerification'
}
check.dependsOn verify
tasks.register('verifyCurves', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.detector.core.StandardCurveVerification'
}
check.dependsOn verifyCurves
tasks.register('verifyDemoCatalog', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.detector.core.DemoCatalogVerification'
}
check.dependsOn verifyDemoCatalog
tasks.register('verifyAcquisition', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.detector.core.AcquisitionVerification'
}
check.dependsOn verifyAcquisition
tasks.register('verifyAi', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.detector.core.AiVerification'
}
check.dependsOn verifyAi
tasks.register('demoAi', JavaExec) {
    dependsOn classes
    workingDir rootProject.projectDir
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.detector.core.AiDemo'
    if (project.hasProperty('aiOutput')) args project.property('aiOutput')
}
