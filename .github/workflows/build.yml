name: Java and Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Verify core and assemble demo
        run: bash gradlew :core:check :desktop:build :app:assembleDebug :app:lintDebug --no-daemon
      - name: Desktop workflow smoke test
        run: xvfb-run -a bash gradlew -PdesktopOnly :desktop:verifyUi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-demo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-evidence
          path: desktop/build/ui-evidence/*.png
